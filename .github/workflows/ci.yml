name: Submission gates
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src app scripts
      - name: Verify shipped model before retraining
        run: python -c "from src.model.crowd_predictor import CrowdPredictor; from src.pipeline.data_loader import DataLoader; p=CrowdPredictor.load(); values=p.predict_network(DataLoader.load_stations().station_id.tolist(),18,3,'Storm',0); assert len(values)==20 and all(0<=v<=1 for v in values.values())"
      - run: python -m src.model.train
      - run: python -m pytest --cov=src.pipeline --cov=src.model --cov=src.routing --cov-branch --cov-fail-under=90 --cov-report=json:results/coverage.json --junitxml=results/junit.xml
      - run: python -m scripts.benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: results/
