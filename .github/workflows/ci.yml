name: CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**", "docs/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ --count --max-line-length=120 --statistics || true

      - name: Generate data and train model
        run: |
          python -m src.transport.data_gen
          python -m src.transport.model

      - name: Run Pytest with Coverage
        run: |
          pytest -c pytest.ini --cov=src/transport --cov-fail-under=80 tests/ -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
